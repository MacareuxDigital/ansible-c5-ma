- name: Install MariaDB Client (yum - official repo)
  yum:
    name:
      - MariaDB-devel
      - MariaDB-client
    state: installed
  register: result
  when:
    - mariadb_repo not in ["10.5","5.5"]
    - aws_awslinux != "2023"
    
- name: Install MariaDB Client (yum - Amazon Linux native)
  yum:
    name:
      - mariadb
      - mariadb-devel
    state: installed
  register: result
  when:
    - mariadb_repo in ["10.5","5.5"]
    - aws_awslinux != "2023"

- name: Install MariaDB Client (dnf - AL2023 native 10.5+)
  dnf:
    name:
      - mariadb
      - mariadb-devel
    state: installed
  register: result
  when:
    - aws_awslinux=="2023"
    - mariadb_repo in ["10.5", "10.6", "10.11"]

- name: Install MariaDB Client (dnf - AL2023 official repo)
  dnf:
    name:
      - MariaDB-devel
      - MariaDB-client
    state: installed
  register: result
  when:
    - aws_awslinux=="2023"
    - mariadb_repo not in ["10.5", "10.6", "10.11", "5.5"]
- name: Install pip (yum)
  when: aws_awslinux not in ["1","2","2023"]
  yum:
    name:
      - python-pip
    state: latest
    
- name: Install pip (dnf for AL2023)
  when: aws_awslinux == "2023"
  dnf:
    name:
      - python3-pip
    state: latest
- name: Install python mysqlmodule
  when: aws_awslinux not in ["2"]
  pip: name=mysql state=latest
