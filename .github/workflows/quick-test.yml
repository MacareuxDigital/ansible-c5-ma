name: Quick Test - Common Configurations

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# This workflow tests the most common configuration combinations
# For full matrix testing, see test-all-summary.yml

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint

      - name: Run yamllint
        run: |
          cd prod-ansible-role
          yamllint -d "{extends: default, rules: {line-length: {max: 200}}}" setup.yml || true
        continue-on-error: true

      - name: Run ansible-lint
        run: |
          cd prod-ansible-role
          ansible-lint setup.yml || true
        continue-on-error: true

      - name: Ansible syntax check
        run: |
          cd prod-ansible-role
          ansible-playbook setup.yml --syntax-check

  common-configs:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [quick-validation]

    strategy:
      fail-fast: false
      matrix:
        include:
          # Most popular configurations
          - name: "AL2023 + PHP8.3 + NGINX + MariaDB10.6"
            os: "2023"
            php: "php8.3"
            php_var: "php_version_amznlinux2023"
            webserver: "nginx"
            database: "mariadb"
            db_version: "10.6"
            db_var: "mariadb_repo"

          - name: "AL2023 + PHP8.2 + Apache + MariaDB10.6"
            os: "2023"
            php: "php8.2"
            php_var: "php_version_amznlinux2023"
            webserver: "apache"
            database: "mariadb"
            db_version: "10.6"
            db_var: "mariadb_repo"

          - name: "AL2 + PHP8.1 + NGINX + MySQL8.0"
            os: "2"
            php: "php8.1"
            php_var: "php_version_amznlinux2"
            webserver: "nginx"
            database: "mysql"
            db_version: "80"
            db_var: "mysql_repo"

          - name: "AL2 + PHP7.4 + Apache + MariaDB10.5"
            os: "2"
            php: "php7.4"
            php_var: "php_version_amznlinux2"
            webserver: "apache"
            database: "mariadb"
            db_version: "10.5"
            db_var: "mariadb_repo"

          - name: "CentOS7 + PHP8.1 + NGINX + MariaDB10.6"
            os: "no"
            php: "php81"
            php_var: "php_version_remi"
            webserver: "nginx"
            database: "mariadb"
            db_version: "10.6"
            db_var: "mariadb_repo"

          - name: "CentOS7 + PHP7.4 + Apache + MySQL5.7"
            os: "no"
            php: "php74"
            php_var: "php_version_remi"
            webserver: "apache"
            database: "mysql"
            db_version: "57"
            db_var: "mysql_repo"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Create test configuration
        run: |
          cd prod-ansible-role
          cp setup.yml setup-test.yml

          # Update OS configuration
          sed -i 's/aws_awslinux:.*/aws_awslinux: "${{ matrix.os }}"/' setup-test.yml

          # Update PHP configuration
          sed -i 's/${{ matrix.php_var }}:.*/${{ matrix.php_var }}: "${{ matrix.php }}"/' setup-test.yml

          # Update web server
          sed -i 's/webserver_handle:.*/webserver_handle: "${{ matrix.webserver }}"/' setup-test.yml

          # Update database
          sed -i 's/db_environment:.*/db_environment: "${{ matrix.database }}"/' setup-test.yml
          sed -i 's/${{ matrix.db_var }}:.*/${{ matrix.db_var }}: "${{ matrix.db_version }}"/' setup-test.yml

          # Set CentOS version if needed
          if [ "${{ matrix.os }}" = "no" ]; then
            sed -i 's/centos_version:.*/centos_version: "7"/' setup-test.yml
            sed -i 's/centos_phprepo:.*/centos_phprepo: "remi"/' setup-test.yml
          fi

      - name: Validate syntax
        run: |
          cd prod-ansible-role
          ansible-playbook setup-test.yml --syntax-check

      - name: Test passed
        run: |
          echo "✅ Configuration validated successfully"
          echo "   ${{ matrix.name }}"

  summary:
    name: Quick Test Summary
    runs-on: ubuntu-latest
    needs: [quick-validation, common-configs]
    if: always()

    steps:
      - name: Display results
        run: |
          echo "========================================="
          echo "  Quick Test Results"
          echo "========================================="
          echo ""
          echo "Validated 6 most common configurations:"
          echo ""
          if [ "${{ needs.common-configs.result }}" = "success" ]; then
            echo "✅ Amazon Linux 2023 + PHP 8.3 + NGINX + MariaDB 10.6"
            echo "✅ Amazon Linux 2023 + PHP 8.2 + Apache + MariaDB 10.6"
            echo "✅ Amazon Linux 2 + PHP 8.1 + NGINX + MySQL 8.0"
            echo "✅ Amazon Linux 2 + PHP 7.4 + Apache + MariaDB 10.5"
            echo "✅ CentOS 7 + PHP 8.1 + NGINX + MariaDB 10.6"
            echo "✅ CentOS 7 + PHP 7.4 + Apache + MySQL 5.7"
            echo ""
            echo "========================================="
            echo "✅ ALL QUICK TESTS PASSED"
            echo "========================================="
          else
            echo "❌ Some tests failed. Check logs above."
            exit 1
          fi
          echo ""
          echo "💡 For comprehensive testing of all 156 combinations,"
          echo "   see the 'All OS Matrix' workflow in GitHub Actions."
