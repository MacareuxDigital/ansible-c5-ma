name: Quick Test - Common Configurations

on:
  push:
    branches: [ main, master, develop, feature/* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Ansible syntax check
        run: |
          cd prod-ansible-role
          echo "[test]" > inventory-test.ini
          echo "localhost ansible_connection=local" >> inventory-test.ini
          ansible-playbook -i inventory-test.ini setup.yml --syntax-check
          echo "✅ Syntax check passed"

  summary:
    name: Quick Test Summary
    runs-on: ubuntu-latest
    needs: [quick-validation]
    if: always()

    steps:
      - name: Display results
        run: |
          echo "========================================="
          echo "  Quick Test Results"
          echo "========================================="
          echo ""
          if [ "${{ needs.quick-validation.result }}" = "success" ]; then
            echo "✅ Ansible playbook syntax validation passed"
            echo ""
            echo "========================================="
            echo "✅ QUICK TEST PASSED"
            echo "========================================="
          else
            echo "❌ Syntax validation failed. Check logs above."
            exit 1
          fi
