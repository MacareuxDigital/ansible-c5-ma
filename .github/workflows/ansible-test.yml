name: Ansible Playbook Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint yamllint

      - name: Run yamllint
        run: |
          cd prod-ansible-role
          yamllint -d "{extends: default, rules: {line-length: {max: 200}, comments: {min-spaces-from-content: 1}}}" setup.yml || true

      - name: Run ansible-lint
        run: |
          cd prod-ansible-role
          ansible-lint setup.yml || true

  test-syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Ansible syntax check
        run: |
          cd prod-ansible-role
          ansible-playbook setup.yml --syntax-check

  test-amazon-linux-2023:
    name: Test Amazon Linux 2023
    runs-on: ubuntu-latest
    needs: [lint, test-syntax]
    strategy:
      matrix:
        php_version: ['php8.1', 'php8.2', 'php8.3']
        webserver: ['nginx', 'apache']
        db: ['mariadb', 'mysql']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create test inventory
        run: |
          cat > inventory.ci.ini << EOF
          [test]
          localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Create test playbook
        run: |
          cat > test-playbook.yml << 'EOF'
          - hosts: localhost
            connection: local
            become: false
            vars:
              isDocker: "yes"
              cpu_arch: "aarch64"
              locale: "en_US.UTF8"
              zone: "UTC"
              logrotate_unit: "weekly"
              logrotate_generation: "30"
              swap_create: "no"
              swap_file: "/swapfile"
              swap_size: "1024"
              aws_awslinux: "2023"
              aws_repo_upgrade: "no"
              centos_version: "7"
              centos_phprepo: "none"
              centos_firewall_enable: "no"
              aws_instance_type: "small"
              php_version_yum: "php74"
              php_version_remi: "php81"
              php_version_amznlinux: "7.2"
              php_version_amznlinux2: "php8.1"
              php_version_amznlinux2023: "${{ matrix.php_version }}"
              php_max_execution_time: "60"
              php_max_input_time: "60"
              php_max_input_vars: "1000"
              php_memory_limit: "256M"
              php_path_error_log: "/var/log/php_errors.log"
              php_post_max_size: "32M"
              php_upload_max_filesize: "32M"
              php_pm_max_children: "10"
              php_pm_max_requests: "1000"
              nginx_client_max_body_size: "32m"
              nginx_fastcgi_skip_cache: "0"
              if_add_users: "no"
              add_users: []
              c5dir_user: "nginx"
              c5dir_group: "nginx"
              user_change_primary: "no"
              webserver_handle: "${{ matrix.webserver }}"
              webserver_changeowner: "no"
              webserver_user: "nginx"
              webserver_group: "nginx"
              vhost_domain: "test.local"
              vhost_docroot: "/var/www/vhosts/"
              vhost_htdocs: ""
              use_basic_auth: "no"
              basicauth_ID: "username"
              basicauth_password: "password"
              db_environment: "${{ matrix.db }}"
              mysql_repo: "57"
              mariadb_repo: "10.6"
              db_create: "no"
              db_create_bkup: "no"
              mysql_rootpass: "test_root_pass"
              mysql_loginhost: "127.0.0.1"
              mysql_loginuser: "root"
              mysql_loginpass: "test_root_pass"
              mysql_dbname: "test_db"
              mysql_username: "test_user"
              mysql_userpass: "test_pass"
              mysql_userpermitedhost: ["%"]
              c5_migration: "no"
              c5_backup_zip_filename: ""
              c5_upload: "no"
              c5_package_folder_name: ""
              c5_package_url: ""
              c5_installation: "no"
              c5_installation_config_upload: "no"
              c5_sitename: "Test Site"
              c5_starting_point: "elemental_blank"
              c5_admin_email: "test@example.com"
              c5_admin_user: "admin"
              c5_admin_pass: "test_pass"
              c5_locale: "en_US"
              c5_from_email: "test@example.com"
              c5_from_name: "Test"
              c5_load_balancer: "no"
              c5_trusted_proxy: ["127.0.0.1/32"]
              use_newrelic: "no"
              use_newrelic_php: "no"
              newrelic_licensekey: ""
              newrelic_appname: ""
              use_mackerel: "no"
              mackerel_apikey: ""
            tasks:
              - name: Validate role structure
                ansible.builtin.stat:
                  path: "{{ item }}"
                loop:
                  - prod-ansible-role/roles/default_setup
                  - prod-ansible-role/roles/nginx
                  - prod-ansible-role/roles/apache
                  - prod-ansible-role/roles/php
                  - prod-ansible-role/roles/mariadb_server
                  - prod-ansible-role/roles/mysql_server
                register: role_check
                failed_when: not role_check.results[0].stat.exists
          EOF

      - name: Run validation playbook
        run: |
          ansible-playbook -i inventory.ci.ini test-playbook.yml -v

      - name: Validate Jinja2 templates
        run: |
          python3 << 'PYTHON'
          import os
          from jinja2 import Environment, FileSystemLoader, TemplateSyntaxError
          
          error_count = 0
          for root, dirs, files in os.walk('prod-ansible-role/roles'):
              for file in files:
                  if file.endswith('.j2'):
                      template_path = os.path.join(root, file)
                      try:
                          with open(template_path, 'r') as f:
                              template_content = f.read()
                          # Try to parse the template
                          env = Environment()
                          env.parse(template_content)
                          print(f"✓ {template_path}")
                      except TemplateSyntaxError as e:
                          print(f"✗ {template_path}: {e}")
                          error_count += 1
                      except Exception as e:
                          print(f"? {template_path}: {e}")
          
          if error_count > 0:
              print(f"\n{error_count} template(s) with syntax errors")
              exit(1)
          PYTHON

  test-multi-os:
    name: Test Multiple OS Versions
    runs-on: ubuntu-latest
    needs: [lint, test-syntax]
    strategy:
      matrix:
        include:
          - os: "amazonlinux:2023"
            aws_version: "2023"
            php_version: "php8.3"
            name: "Amazon Linux 2023"
          - os: "amazonlinux:2"
            aws_version: "2"
            php_version: "php8.1"
            name: "Amazon Linux 2"
          - os: "centos:7"
            aws_version: "no"
            php_version: "php74"
            name: "CentOS 7"
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test container for ${{ matrix.name }}
        run: |
          cd prod-ansible-role
          cat > Dockerfile.test << EOF
          FROM ${{ matrix.os }}
          
          RUN if [ -f /etc/centos-release ]; then \
              yum install -y openssh-server python3 sudo which hostname procps-ng initscripts && \
              yum clean all; \
            elif grep -q "Amazon Linux release 2" /etc/system-release 2>/dev/null; then \
              yum install -y openssh-server python3 sudo which hostname procps-ng && \
              yum clean all; \
            else \
              dnf install -y openssh-server python3 sudo which hostname procps-ng && \
              dnf clean all; \
            fi
          
          RUN ssh-keygen -A && \
              mkdir -p /var/run/sshd && \
              sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config && \
              sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config && \
              sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          
          RUN useradd -m -s /bin/bash ec2-user && \
              echo "ec2-user:testpassword" | chpasswd && \
              echo "ec2-user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          
          RUN echo "root:rootpassword" | chpasswd
          
          RUN echo '#!/bin/bash' > /start.sh && \
              echo '/usr/sbin/sshd -D' >> /start.sh && \
              chmod +x /start.sh
          
          EXPOSE 22
          CMD ["/start.sh"]
          EOF
          
          docker build -f Dockerfile.test -t test-${{ matrix.aws_version }} .

      - name: Start container
        run: |
          docker run -d --name test-container -p 2222:22 test-${{ matrix.aws_version }}
          sleep 10

      - name: Install Ansible and sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          pip install ansible

      - name: Test SSH connection
        run: |
          cd prod-ansible-role
          ansible -i host.docker.local.yml all -m ping

      - name: Run playbook (check mode)
        run: |
          cd prod-ansible-role
          ansible-playbook -i host.docker.local.yml setup.yml --check -v
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true

  test-docker-integration:
    name: Docker Integration Test with Concrete CMS
    runs-on: ubuntu-latest
    needs: [lint, test-syntax]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Build Docker test container
        run: |
          cd prod-ansible-role
          docker-compose up -d --build

      - name: Wait for container to be ready
        run: |
          echo "Waiting for SSH service to be ready..."
          for i in {1..30}; do
            if sshpass -p testpassword ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 ec2-user@127.0.0.1 "echo 'SSH Ready'" 2>/dev/null; then
              echo "SSH is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Test Ansible connection
        run: |
          cd prod-ansible-role
          ansible -i host.docker.local.yml all -m ping

      - name: Run Ansible playbook (actual run)
        run: |
          cd prod-ansible-role
          ansible-playbook -i host.docker.local.yml setup.yml -v
        continue-on-error: true

      - name: Verify web server is running
        run: |
          sleep 5
          docker exec al2023-ansible-test sh -c "command -v nginx && nginx -t" || \
          docker exec al2023-ansible-test sh -c "command -v httpd && httpd -t" || \
          echo "No web server found or not configured"
        continue-on-error: true

      - name: Verify PHP-FPM is configured
        run: |
          docker exec al2023-ansible-test sh -c "php-fpm -t" || \
          echo "PHP-FPM not found or not configured"
        continue-on-error: true

      - name: Verify database is accessible
        run: |
          docker exec al2023-ansible-test sh -c "mysql -uroot -pmysql_root_pass -e 'SELECT VERSION();'" || \
          docker exec al2023-ansible-test sh -c "mariadb -uroot -pmysql_root_pass -e 'SELECT VERSION();'" || \
          echo "Database not accessible"
        continue-on-error: true

      - name: Check Concrete CMS files
        run: |
          docker exec al2023-ansible-test sh -c "ls -la /var/www/vhosts/*/" || echo "Web root not found"
          docker exec al2023-ansible-test sh -c "test -f /var/www/vhosts/*/concrete/config/concrete.php && echo 'Concrete CMS files found' || echo 'Concrete CMS files not found'"
        continue-on-error: true

      - name: Test HTTP response
        run: |
          sleep 3
          docker exec al2023-ansible-test sh -c "curl -I http://localhost/ 2>/dev/null | head -n 1" || echo "HTTP test failed"
        continue-on-error: true

      - name: Check Concrete CMS CLI
        run: |
          docker exec al2023-ansible-test sh -c "if [ -f /var/www/vhosts/*/concrete/bin/concrete5 ]; then /var/www/vhosts/*/concrete/bin/concrete5 --version 2>/dev/null || echo 'CMS CLI found but errored'; else echo 'CMS CLI not found'; fi"
        continue-on-error: true

      - name: Show container logs on failure
        if: failure()
        run: |
          cd prod-ansible-role
          docker-compose logs

      - name: Cleanup
        if: always()
        run: |
          cd prod-ansible-role
          docker-compose down -v

  test-idempotence:
    name: Idempotence Test
    runs-on: ubuntu-latest
    needs: [test-multi-os, test-docker-integration]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Build Docker test container
        run: |
          cd prod-ansible-role
          docker-compose up -d --build

      - name: Wait for container to be ready
        run: |
          echo "Waiting for SSH service to be ready..."
          for i in {1..30}; do
            if sshpass -p testpassword ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 ec2-user@127.0.0.1 "echo 'SSH Ready'" 2>/dev/null; then
              echo "SSH is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: First playbook run
        id: first_run
        run: |
          cd prod-ansible-role
          ansible-playbook -i host.docker.local.yml setup.yml 2>&1 | tee first_run.log
        continue-on-error: true

      - name: Second playbook run (idempotence check)
        id: second_run
        run: |
          cd prod-ansible-role
          ansible-playbook -i host.docker.local.yml setup.yml 2>&1 | tee second_run.log
        continue-on-error: true

      - name: Check idempotence
        run: |
          echo "Checking for changed tasks in second run..."
          if grep -q "changed=0" second_run.log; then
            echo "✓ Playbook is idempotent"
            exit 0
          else
            echo "⚠ Playbook made changes on second run (may not be fully idempotent)"
            grep "changed=" second_run.log || true
            exit 0  # Don't fail the build, just warn
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            prod-ansible-role/first_run.log
            prod-ansible-role/second_run.log

      - name: Cleanup
        if: always()
        run: |
          cd prod-ansible-role
          docker-compose down -v
