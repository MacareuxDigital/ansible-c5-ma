# Install PHP for Amazon Linux 2 (Remi packages)
- name: Install prerequisites for PHP
  yum:
    name:
      - httpd
      - fontconfig-devel
      - harfbuzz
      - libxml2-devel
      - libxslt-devel
      - libX11
      - libXpm
      - ncurses-compat-libs
    state: latest

- name: Install libzip5 for PHP 8.1
  yum:
    name: libzip5
    enablerepo: remi
    state: latest
  when: php_version_amznlinux2 in ["php81"]

- name: Install Remi PHP packages
  yum:
    name:
      - "php"
      - "php-common"
      - "php-cli"
      - "php-fpm"
      - "php-gd"
      - "php-mbstring"
      - "php-mysql"
      - "php-opcache"
      - "php-pdo"
      - "php-xml"
      - "php-gmp"
      - "php-bcmath"
      - "php-pecl-zip"
    state: latest
    enablerepo: "epel,remi,remi-{{ php_version_amznlinux2 }}"
    disablerepo: amzn2-core
  register: php_installation_status

- name: Install PHP mcrypt for PHP 5.6
  yum:
    name: "php-mcrypt"
    state: latest
    enablerepo: "epel,remi,remi-{{ php_version_amznlinux2 }}"
  when: php_version_amznlinux2 in ["php56"]

- name: Install memcached & redis for PHP 8.x
  yum:
    name:
      - "php-pecl-memcached"
      - "php-redis"
    state: latest
    enablerepo: "epel,remi,remi-{{ php_version_amznlinux2 }}"
  when: php_version_amznlinux2 in ["php80", "php81"]

- name: Enable PHP-FPM service
  systemd:
    name: php-fpm
    state: started
    enabled: yes
  when:
    - isDocker == "no"
  ignore_errors: yes