name: Amazon Linux 2023 - Full Stack Matrix

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  al2023-matrix:
    name: AL2023 | PHP ${{ matrix.php }} | ${{ matrix.webserver }} | ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        webserver: ['nginx', 'apache']
        database: ['mariadb-10.4', 'mariadb-10.5', 'mariadb-10.6', 'mariadb-10.11', 'mariadb-11.4', 'mariadb-11.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create test configuration
        run: |
          cd prod-ansible-role
          cp setup.yml setup-test.yml

          # Create minimal test inventory
          echo "[test]" > inventory-test.ini
          echo "localhost ansible_connection=local" >> inventory-test.ini

          # Update configuration for this test combination
          sed -i 's/aws_awslinux:.*/aws_awslinux: "2023"/' setup-test.yml
          sed -i 's/php_version_amznlinux2023:.*/php_version_amznlinux2023: "php${{ matrix.php }}"/' setup-test.yml
          sed -i 's/webserver_handle:.*/webserver_handle: "${{ matrix.webserver }}"/' setup-test.yml
          sed -i 's/cpu_arch:.*/cpu_arch: "x86_64"/' setup-test.yml
          sed -i 's/centos_version:.*/centos_version: "7"/' setup-test.yml

          # Set database configuration
          if [[ "${{ matrix.database }}" == mariadb* ]]; then
            sed -i 's/db_environment:.*/db_environment: "mariadb"/' setup-test.yml
            MARIADB_VER=$(echo "${{ matrix.database }}" | cut -d'-' -f2)
            sed -i "s/mariadb_repo:.*/mariadb_repo: \"${MARIADB_VER}\"/" setup-test.yml
          fi

          # Disable Concrete CMS upload for PHP 8.5 (not yet supported)
          if [[ "${{ matrix.php }}" == "8.5" ]]; then
            sed -i 's/c5_upload:.*/c5_upload: "no"/' setup-test.yml
            echo "⚠️  PHP 8.5 detected - Concrete CMS upload disabled (not yet supported)"
          fi

          echo ""
          echo "✓ Test configuration created"
          echo "  OS: Amazon Linux 2023"
          echo "  PHP: php${{ matrix.php }}"
          echo "  Web Server: ${{ matrix.webserver }}"
          echo "  Database: ${{ matrix.database }}"

      - name: Validate Ansible syntax
        run: |
          cd prod-ansible-role
          ansible-playbook -i inventory-test.ini setup-test.yml --syntax-check
          echo "✅ Ansible syntax validation passed"

      - name: Verify role structure
        run: |
          cd prod-ansible-role

          # Verify required roles exist
          for role in php nginx apache mariadb_server mariadb_client mariadb_repo; do
            if [ -d "roles/$role" ]; then
              echo "✓ Role $role exists"
            else
              echo "✗ Role $role missing"
            fi
          done

      - name: Validate templates
        run: |
          cd prod-ansible-role

          # Check web server templates
          if [ "${{ matrix.webserver }}" = "nginx" ]; then
            if [ -d "roles/nginx/templates" ]; then
              echo "✓ NGINX templates directory exists"
              ls roles/nginx/templates/*.j2 2>/dev/null && echo "  Found $(ls roles/nginx/templates/*.j2 | wc -l) templates" || true
            fi
          else
            if [ -d "roles/apache/templates" ]; then
              echo "✓ Apache templates directory exists"
              ls roles/apache/templates/*.j2 2>/dev/null && echo "  Found $(ls roles/apache/templates/*.j2 | wc -l) templates" || true
            fi
          fi

          # Check database templates
          if [[ "${{ matrix.database }}" == mariadb* ]]; then
            if [ -d "roles/mariadb_server/templates" ]; then
              echo "✓ MariaDB templates directory exists"
              ls roles/mariadb_server/templates/*.j2 2>/dev/null && echo "  Found $(ls roles/mariadb_server/templates/*.j2 | wc -l) templates" || true
            fi
          fi

      - name: Test result
        run: |
          echo ""
          echo "================================================"
          echo "✅ Amazon Linux 2023 Test Passed"
          echo "================================================"
          echo "Configuration:"
          echo "  - OS: Amazon Linux 2023"
          echo "  - PHP: ${{ matrix.php }}"
          echo "  - Web Server: ${{ matrix.webserver }}"
          echo "  - Database: ${{ matrix.database }}"
          echo "================================================"

  al2023-summary:
    name: AL2023 Matrix Summary
    runs-on: ubuntu-latest
    needs: [al2023-matrix]
    if: always()

    steps:
      - name: Check matrix results
        run: |
          echo "========================================="
          echo "  Amazon Linux 2023 Matrix Tests"
          echo "========================================="
          echo ""
          echo "Tested combinations:"
          echo "  • PHP versions: 8.1, 8.2, 8.3, 8.4, 8.5"
          echo "  • Web servers: nginx, apache"
          echo "  • Databases: MariaDB 10.4, 10.5, 10.6, 10.11, 11.4, 11.5"
          echo ""
          echo "Total test combinations: 60"
          echo ""
          if [ "${{ needs.al2023-matrix.result }}" = "success" ]; then
            echo "✅ All Amazon Linux 2023 tests passed!"
          else
            echo "❌ Some tests failed. Check individual jobs above."
            exit 1
          fi
