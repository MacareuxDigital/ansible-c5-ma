- name: Install utilities (non-AL2023)
  yum:
    name:
      - "wget"
      - "tcpdump"
      - "sysstat"
      - "nmap"
      - "gcc"
      - "make"
      - "git"
      - "openssl-devel"
      - "vim-enhanced"
      - "python-devel"
      - "python-setuptools"
      - "python-pip"
      - "curl"
      - "curl-devel"
      - "zip"
      - "unzip"
    state: latest
  when: aws_awslinux != "2023"

- name: Install utilities (AL2023)
  dnf:
    name:
      - "wget"
      - "tcpdump"
      - "sysstat"
      - "nmap"
      - "gcc"
      - "make"
      - "git"
      - "openssl-devel"
      - "vim-enhanced"
      # AL2023 uses Python 3 by default
      - "python3-devel"
      - "python3-setuptools"
      - "python3-pip"
      # curl-minimal is already installed, avoid conflict
      # - "curl"
      - "zip"
      - "unzip"
    state: latest
  when: aws_awslinux == "2023"

- name: Install MySQL-Python for Amazon Linux 1
  yum:
    name:
      - "MySQL-python"
    state: latest
  when: aws_awslinux == "1"

- name: Install MySQL-Python for Amazon Linux 2
  yum:
    name:
      - "python3-pip"
      - "MySQL-python"
    state: latest
  when: aws_awslinux == "2"

- name: Install Python3 pip for Amazon Linux 2023
  dnf:
    name:
      - "python3-pip"
    state: latest
  when: aws_awslinux == "2023"

- name: Install PyMySQL with pip (non-AL2023)
  pip:
    name: pymysql
    state: present
  when: aws_awslinux != "2023"

- name: Install PyMySQL with pip3 (AL2023)
  pip:
    name: pymysql
    executable: pip3
    state: present
  when: aws_awslinux == "2023"

- name: Install mail
  yum:
    name:
      - "mail"
    state: latest
  when: centos_version == "6" and aws_awslinux != "2023"

- name: Install mailx (CentOS 7 or Amazon Linux 2)
  yum:
    name:
      - "mailx"
    state: latest
  when: centos_version == "7" and aws_awslinux != "2023"

- name: Install mailx (Amazon Linux 2023)
  dnf:
    name:
      - "mailx"
    state: latest
  when: aws_awslinux == "2023"

- name: Install utilities for PHP 5.6 on Amazon Linux 2
  yum:
    name:
      - "alsa-lib"
      - "automake"
      - "fontconfig"
      - "GConf2"
      - "glib"
      - "harfbuzz"
      - "libedit-devel"
      - "libtool-ltdl"
      - "libXt"
      - "libXScrnSaver"
      - "libXpm"
      - "libxml2-devel"
      - "libxslt-devel"
      - "ncurses-compat-libs"
      - "t1lib"
    state: latest
  when:
    - aws_awslinux == "2"
    - php_version_amznlinux2 == "php56"