- name: "Set MariDB Repo for non-Amazon Linux 2/2023 server"
  template: src=mariadb.repo.j2 dest=/etc/yum.repos.d/mariadb.repo
  when:
    - aws_awslinux not in ["2", "2023"]
    - mariadb_repo not in ["5.5"]

- name: "Set MariDB Repo (not 10.5) for Amazon Linux 2 server"
  template: src=mariadb.repo.j2 dest=/etc/yum.repos.d/mariadb.repo
  when:
    - mariadb_repo not in ["10.5","5.5"] and aws_awslinux=="2"

- name: "Install MariaDB 10.5 Repo for Amazon Linux 2"
  shell: amazon-linux-extras enable mariadb10.5 -y
  when:
    - mariadb_repo=="10.5" and aws_awslinux=="2"

# Amazon Linux 2023 uses native MariaDB packages for 10.5+
- name: "No additional repo needed for MariaDB 10.5+ on Amazon Linux 2023"
  debug:
    msg: "Amazon Linux 2023 includes MariaDB 10.5+ in native repositories"
  when:
    - aws_awslinux=="2023"
    - mariadb_repo in ["10.5", "10.6", "10.11"]

- name: "Set MariaDB Repo for older versions on Amazon Linux 2023"
  template: src=mariadb.repo.j2 dest=/etc/yum.repos.d/mariadb.repo
  when:
    - aws_awslinux=="2023"
    - mariadb_repo not in ["10.5", "10.6", "10.11", "5.5"]
