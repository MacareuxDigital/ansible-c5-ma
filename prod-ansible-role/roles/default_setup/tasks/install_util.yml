- name: Install utilities (yum)
  yum:
    name:
      - "wget"
      - "tcpdump"
      - "sysstat"
      - "nmap"
      - "gcc"
      - "make"
      - "git"
      - "openssl-devel"
      - "vim-enhanced"
      - "python-devel"
      - "python-setuptools"
      - "python-pip"
      - "curl"
      - "curl-devel"
      - "zip"
      - "unzip"
    state: latest
  when: aws_awslinux != "2023"

- name: Install utilities (dnf for AL2023)
  dnf:
    name:
      - "wget"
      - "tcpdump"
      - "sysstat"
      - "nmap-ncat"
      - "gcc"
      - "make"
      - "git"
      - "openssl-devel"
      - "vim-enhanced"
      - "python3-devel"
      - "python3-setuptools"
      - "python3-pip"
      - "curl"
      - "libcurl-devel"
      - "zip"
      - "unzip"
    state: latest
  when: aws_awslinux == "2023"

- name: Install MySQL-Python for Amazon Linux
  yum:
    name:
      - "MySQL-python"
    state: latest
  when: aws_awslinux=="1"
- name: Install MySQL-Python for Amazon Linux 2
  yum:
    name:
      - "python3-pip"
      - "MySQL-python"
    state: latest
  when: aws_awslinux=="2"

- name: Install MySQL-Python for Amazon Linux 2023
  dnf:
    name:
      - "python3-pip"
      - "python3-PyMySQL"
    state: latest
  when: aws_awslinux=="2023"

- name: Install python3-mysqld
  pip:
    name: pymysql
    state: present

- name: Install mail
  yum:
    name:
      - "mail"
    state: latest
  when: centos_version=="6"
- name: Install mailx (yum)
  yum:
    name:
      - "mailx"
    state: latest
  when: centos_version=="7" and aws_awslinux != "2023"

- name: Install mailx (dnf for AL2023)
  dnf:
    name:
      - "s-nail"
    state: latest
  when: aws_awslinux=="2023"

- name: Install utilities for PHP 5.6 on Amazon Linux 2
  yum:
    name:
      - "alsa-lib"
      - "automake"
      - "fontconfig"
      - "GConf2"
      - "glib"
      - "harfbuzz"
      - "libedit-devel"
      - "libtool-ltdl"
      - "libXt"
      - "libXScrnSaver"
      - "libXpm"
      - "libxml2-devel"
      - "libxslt-devel"
      - "ncurses-compat-libs"
      - "t1lib"
    state: latest
  when:
    - aws_awslinux=="2"
    - php_version_amznlinux2=="php56"
