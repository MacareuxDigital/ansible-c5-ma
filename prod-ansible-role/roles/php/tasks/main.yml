# Main PHP installation playbook

# Define common PHP packages
- name: Set common PHP package variables
  set_fact:
    php_installation_status: null

# Installation tasks organized by OS distribution
- name: Install PHP for Amazon Linux 1
  include_tasks: tasks/php_amazon_linux1.yml
  when: aws_awslinux == "1"

- name: Install PHP for Amazon Linux 2 (standard packages)
  include_tasks: tasks/php_amazon_linux2_standard.yml
  when: 
    - aws_awslinux == "2"
    - php_version_amznlinux2 not in ["php56", "php80", "php81"]

- name: Install PHP for Amazon Linux 2 (Remi packages)
  include_tasks: tasks/php_amazon_linux2_remi.yml
  when:
    - aws_awslinux == "2"
    - php_version_amznlinux2 in ["php56", "php80", "php81"]

- name: Install PHP for CentOS 7 (Remi)
  include_tasks: tasks/php_centos7_remi.yml
  when:
    - aws_awslinux == "no"
    - centos_phprepo == "remi"

# User and permissions configuration
- name: Configure users and groups
  include_tasks: tasks/configure_users.yml

# Service management
- name: Manage services
  include_tasks: tasks/manage_services.yml
  when: isDocker == "no"

# PHP configuration
- name: Configure PHP and PHP-FPM
  include_tasks: tasks/configure_php.yml